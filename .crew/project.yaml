# The project's onboarding record (#111). Intent is the Sponsor's, written
# through `crew onboard`. Design is the project's Architect's, and learned
# is the crew's; both are proposed by pull request.
version: 3
intent:
  scope:
    purpose: Work out how the crew's delivery went, for each sprint and across many
      sprints, for the Sponsor. A service the crew feeds and reads back; nobody uses
      it directly.
    serves:
    - who: The Sponsor, reading the sprint overview on the crew-presentation site
      needs:
      - What stories, epics and Goals got done.
      - How long each step took, as working time.
      - DORA's four measures, to call out what matters.
    - who: The Sponsor, comparing sprints
      needs:
      - How the crew changes across many sprints, not one sprint against the last.
    out_of_scope:
    - 'Reporting on anything beyond the projects the Sponsor has asked the crew to
      contribute to: today, one or more repositories in this GitHub organization''s
      crew project. Expanding past this organization and project is not planned.'
    - Being used directly by a person. The crew sends it events and reads its answers
      back.
    - The day's replay and a story's life cycle. They come from the crew's own event
      record, carried in delivery-history.
    - An MCP server, for now.
  release:
    deploys: false
    publishes: true
    where: A version tag vX.Y.Z on the sprint-metrics repo, with a GitHub Release,
      and a container image at ghcr.io/mqucifer/sprint-metrics:X.Y.Z. The crew installs
      the tool as a git dependency pinned to the tag, or runs the image by its tag.
    image: private
  done:
    bar: A change is done when its acceptance criteria are met and every check the
      project's CI runs passes.
    never_touch:
    - .github/workflows/board.yml
  priority: 1
design:
  language: Python 3.12
  dependencies: 'Runtime: psycopg>=3.1, opentelemetry-sdk>=1.24, opentelemetry-exporter-otlp>=1.24.
    Dev: pytest>=8.0, ruff>=0.6, pyyaml>=6.0, jsonschema>=4.0.'
  sandbox: 'Python 3.12 interpreter and uv (the package manager). No Postgres, no
    Docker, no other tools are required to build or test locally. The store''s tests
    skip when SPRINT_METRICS_DB is not set. Docker is available in CI runners but
    is never a local sandbox requirement: it runs only in CI, never in the local checks.'
  checks:
  - uv run ruff check .
  - uv run pytest -q
  lockfile: uv.lock
  ci_checks:
  - 'The docker job builds the image and proves it starts as documented: `docker run
    --rm <image> --help` prints a usage line whose program name comes from the image''s
    ENTRYPOINT (repeating the program name as an argument fails), and every retired
    report argument is refused with a retirement message.'
  - 'The docker job proves the image runs as a user other than root: the entrypoint
    is overridden to `sh -c ''id -u''` and the step fails unless the UID is not zero.'
  - 'The docker job proves the base image is pinned by digest: the Dockerfile''s FROM
    line is checked to contain an @sha256: reference, and the build succeeds against
    that pinned base.'
  - 'The tests job runs the store''s tests against a real Postgres service container:
    a Postgres 16 container (image pinned by digest) is declared in the job''s services
    block, SPRINT_METRICS_DB is set to its connection string, and `uv run pytest -q`
    runs tests/test_store.py and the @requires_db service tests against the live database.'
  - 'The docker job proves the image starts in service mode against a Postgres service:
    POST /sprints and POST /events are accepted, GET /range returns 200 and matches
    the previous image''s /range field-for-field apart from the release''s additive
    keys, the api_version pin, and the retired-measure removals; GET /sprint and GET
    /metrics return 410; and a service started without SPRINT_METRICS_DB exits non-zero
    within 15s, naming the database.'
  - 'The docker job proves database recovery: GET /health returns 503 while the Postgres
    container is stopped, returns 200 after it restarts, and POST /events returns
    200 after recovery.'
  release_how: 'Package versions follow SemVer, separate from the JSON api_version:
    removing an old API version is MAJOR, additions (including a new API version)
    are MINOR, fixes and docs are PATCH. The first release is 1.0.0. CHANGELOG.md
    follows Keep a Changelog; every user-visible PR adds an entry to [Unreleased].
    A release is a PR that bumps the version in pyproject.toml and dates the [Unreleased]
    section. When it merges, the release workflow (triggered on push to main) reads
    the version from pyproject.toml and then checks each published artifact independently,
    creating only what is missing: (1) the git tag vX.Y.Z is created and pushed if
    it does not already exist; (2) the GitHub Release for that tag is created with
    the dated CHANGELOG section as its body if no Release exists for the tag; (3)
    a linux/amd64 and linux/arm64 container image is built and pushed to ghcr.io/mqucifer/sprint-metrics
    tagged X.Y.Z, X.Y, and latest, with build-provenance attestation, using only GITHUB_TOKEN,
    if the image has not yet been published for that tag. A run that fails part-way
    leaves the version for the next run to finish; the version number is not used
    up. The release workflow includes a workflow_dispatch dry-run path that validates
    the pipeline without tagging or pushing. The crew installs the tool as a git dependency
    pinned to the tag (e.g. uv pip install git+https://github.com/mqucifer/sprint-metrics.git@v1.0.0)
    or runs the image by its tag (ghcr.io/mqucifer/sprint-metrics:1.0.0). The service
    mode reads its database connection string from the SPRINT_METRICS_DB environment
    variable; the Dockerfile sets no default, and the variable is documented in docs/service.md.'
  built:
  - A sprint-metrics CLI that reads sprint cards and optional WIP limits from JSON.
  - Computes cycle time, lead time, throughput, WIP-limit violations, blocked-card
    aging, and escalation rate.
  - Outputs a table by default, or JSON, markdown, or Prometheus text exposition format.
  - Serves the Prometheus metrics at /metrics in scrape mode.
  - A service, run from the released container image, that accepts board events over
    HTTP, keeps their history in Postgres under its own schema on a shared server,
    and answers sprint, range and trend queries from that history.
  - GET /trend, one measure across sprints, is unused today. It's to be made good,
    not retired, since comparing sprints is what this project is for.
  - The service's logs and traces, sent as OpenTelemetry over OTLP.
  - Packaging and deployment of the tool so the crew can invoke it.
  structure: 'The package is divided by concern so that parallel stories land in different
    files, and each /range or /trend answer lives in one concern module from its calculation
    to its response attachment to its description fragment. card.py owns the Card
    dataclass and parsing (parse_card, _as_cards, _parse_date, _parse_datetime). metrics.py
    owns the pure metric calculations (cycle/lead time in days and minutes, throughput,
    WIP-limit violations, blocked aging, first-attempt counts and rate, failure breakdown,
    top failure causes, points delivered, the superseded measures, and the cost middle/total
    measures) and their helpers (_mean_days, _state_windows, _peak_occupancy, _median,
    _costed_cards, ALL_METRICS, metric_value). dora.py owns DORA''s first two measures
    (release frequency, lead time for changes) as pure functions. rework.py owns the
    rework answer (sent_backs, qa_returns, by_step) and its calculation. time_splits.py
    owns the working-time answer (per-step and total) and the cost-by-kind answer.
    verdict.py owns the measure registry (MEASURE_REGISTRY) and the window verdict
    (verdict, window_verdicts). thresholds.py owns the default thresholds and calculate_flags.
    report.py owns the response constants API_VERSION and _METRIC_COLUMNS (the display
    names). sprint_range.py owns sprint-label parsing (_parse_sprint_label) and the
    per-sprint range base formatter (format_sprint_range_json: the per-sprint metrics,
    flags, prior and delta). schema.py owns the JSON Schema documents (EVENT_INTAKE_SCHEMA,
    SPRINT_RANGE_SCHEMA, TREND_SCHEMA). Each /range answer module also owns its attachment
    to the range response — cost, rework, roster (from store.py''s query_roster_data),
    dora, working_time, cost_by_kind, verdict, and the window object — and its description
    fragment. store.py owns the Postgres persistence layer: the schema DDL, idempotent
    event insertion (upsert), and every query (sprint, range, roster, dora, working-time,
    card kinds, returned events); all SQL lives here, and no other module constructs
    queries. service.py owns the HTTP server, routing, and intake validation (POST
    /sprints, POST /events; the retired GET /sprint and GET /metrics answer 410),
    and composes the /range and /trend responses by calling each answer module''s
    attachment; it no longer holds the per-answer attachment logic or the endpoint
    description strings. SERVICE_ENDPOINTS is generated from each module''s description
    fragment, so a new measure adds one fragment rather than rewriting a monolithic
    endpoint string. telemetry.py owns OpenTelemetry configuration (tracer, logger,
    OTLP exporter setup). _docs_gen.py owns the generation of the marked (generated)
    sections of the docs/ files and the schema files from the code. __init__.py re-exports
    the public API; __main__.py is the python -m entry point, which starts the service.'
  docs:
  - README.md
  - docs/service.md
  - docs/metrics.md
  - docs/thresholds.md
  - docs/architecture.md
