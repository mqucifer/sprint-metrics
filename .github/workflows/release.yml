name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version-check
        run: |
          set -euo pipefail
          current=$(grep '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"$/\1/')
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            prior=$(git show HEAD~1:pyproject.toml | grep '^version = ' | sed 's/^version = "\(.*\)"$/\1/')
          else
            prior=""
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current_short=$(echo "$current" | sed 's/\.[0-9]*$//')" >> "$GITHUB_OUTPUT"
          echo "prior=$prior" >> "$GITHUB_OUTPUT"
          if [ -n "$prior" ] && [ "$current" = "$prior" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate — version unchanged, no release
        if: github.event_name == 'push' && steps.version-check.outputs.version_changed == 'false'
        run: |
          echo "Version unchanged (${{ steps.version-check.outputs.current }}) — nothing to release."

      - name: Dry-run — no side effects
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry-run: would release version ${{ steps.version-check.outputs.current }} — no tags, releases, or images created."

      - name: Create git tag
        if: github.event_name == 'push' && steps.version-check.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          git tag "v${{ steps.version-check.outputs.current }}"
          git push origin "v${{ steps.version-check.outputs.current }}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.version-check.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version-check.outputs.current }}"
          tag="v${version}"
          if [ -f CHANGELOG.md ]; then
            body=$(awk -v ver="$version" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)
          else
            body=""
          fi
          if [ -z "$body" ]; then
            body="No changelog section found for version ${version}."
          fi
          gh release create "$tag" --title "$tag" --notes "$body"
          echo "Created release $tag"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && steps.version-check.outputs.version_changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: github.event_name == 'push' && steps.version-check.outputs.version_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/mqucifer/sprint-metrics:${{ steps.version-check.outputs.current }}
            ghcr.io/mqucifer/sprint-metrics:${{ steps.version-check.outputs.current_short }}
            ghcr.io/mqucifer/sprint-metrics:latest

      - name: Build container image (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
