name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect version change
        id: version-check
        run: |
          set -euo pipefail
          current=$(grep '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"$/\1/')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current_short=$(echo "$current" | sed 's/\.[0-9]*$//')" >> "$GITHUB_OUTPUT"

      - name: Dry-run — no side effects
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry-run: would release version ${{ steps.version-check.outputs.current }} — no tags, releases, or images created."

      - name: Create git tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="v${{ steps.version-check.outputs.current }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Tag ${tag} already exists — skipping."
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version-check.outputs.current }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — skipping."
            exit 0
          fi
          if [ -f CHANGELOG.md ]; then
            body=$(awk -v ver="$version" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)
          else
            body=""
          fi
          if [ -z "$body" ]; then
            body="No changelog section found for version ${version}."
          fi
          gh release create "$tag" --title "$tag" --notes "$body"
          echo "Created release $tag"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists in registry
        id: image-check
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="${{ steps.version-check.outputs.current }}"
          if docker manifest inspect "ghcr.io/mqucifer/sprint-metrics:${version}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image ghcr.io/mqucifer/sprint-metrics:${version} already exists — skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Image ghcr.io/mqucifer/sprint-metrics:${version} not found in registry."
          fi

      - name: Build and push container image
        if: github.event_name == 'push' && steps.image-check.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/mqucifer/sprint-metrics:${{ steps.version-check.outputs.current }}
            ghcr.io/mqucifer/sprint-metrics:${{ steps.version-check.outputs.current_short }}
            ghcr.io/mqucifer/sprint-metrics:latest

      - name: Build container image (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
