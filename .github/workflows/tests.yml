name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FROM line is pinned by digest
        run: |
          set -euo pipefail
          grep '^FROM ' Dockerfile | grep -q '@sha256:' || {
            echo "ERROR: Dockerfile FROM line is not pinned by a @sha256: digest"
            exit 1
          }
      - name: Build image
        run: docker build -t sprint-metrics-smoke .
      - name: Run sprint-metrics --help
        run: |
          set -euo pipefail
          output=$(docker run --rm sprint-metrics-smoke sprint-metrics --help)
          echo "$output"
          echo "$output" | grep -q "usage:"
      - name: Verify non-root UID
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint sh sprint-metrics-smoke -c 'id -u')
          echo "Container UID: $uid"
          if [ "$uid" -eq 0 ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
      - name: Verify scrape endpoint is reachable
        run: |
          set -euo pipefail

          TMPDIR=$(mktemp -d)
          CONTAINER=""

          cleanup() {
            if [ -n "$CONTAINER" ]; then
              docker stop "$CONTAINER" 2>/dev/null || true
              docker rm "$CONTAINER" 2>/dev/null || true
            fi
            rm -rf "$TMPDIR"
          }
          trap cleanup EXIT

          cat > "$TMPDIR/cards.json" << 'CARDS'
          [
            {
              "id": "1",
              "title": "A card",
              "created": "2024-01-01",
              "started": "2024-01-02",
              "completed": "2024-01-05"
            }
          ]
          CARDS

          CONTAINER=$(docker run -d -p 9100:9100 -v "$TMPDIR":/cards sprint-metrics-smoke --scrape --port 9100 /cards.json)

          METRICS=""
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9100/metrics || true)
            if [ "$HTTP_CODE" = "200" ]; then
              METRICS=$(curl -s http://localhost:9100/metrics)
              break
            fi
            sleep 1
          done

          if [ -z "$METRICS" ]; then
            echo "ERROR: /metrics endpoint did not become reachable within 30 seconds"
            exit 1
          fi

          echo "$METRICS"

          if ! echo "$METRICS" | grep -q 'sprint_cycle_time_days'; then
            echo "ERROR: /metrics response does not contain sprint_cycle_time_days"
            exit 1
          fi

          echo "Scrape endpoint verified: /metrics is reachable and contains Prometheus content"
