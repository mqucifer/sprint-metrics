name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
