name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FROM line is pinned by digest
        run: |
          set -euo pipefail
          grep '^FROM ' Dockerfile | grep -q '@sha256:' || {
            echo "ERROR: Dockerfile FROM line is not pinned by a @sha256: digest"
            exit 1
          }
      - name: Build image
        run: docker build -t sprint-metrics-smoke .
      - name: Run sprint-metrics --help
        run: |
          set -euo pipefail
          output=$(docker run --rm sprint-metrics-smoke --help)
          echo "$output"
          echo "$output" | grep -q "usage:"
      - name: Verify repeating program name fails
        run: |
          set -euo pipefail
          if docker run --rm sprint-metrics-smoke sprint-metrics --help; then
            echo "ERROR: Repeating the program name as an argument should fail"
            exit 1
          fi
          echo "OK: repeating program name correctly fails"
      - name: Verify non-root UID
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint sh sprint-metrics-smoke -c 'id -u')
          echo "Container UID: $uid"
          if [ "$uid" -eq 0 ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
      - name: Verify scrape service is reachable
        run: |
          set -euo pipefail
          CARDS_FILE=$(mktemp /tmp/cards_XXXXXX.json)
          cat > "$CARDS_FILE" << 'EOF'
          [{"title": "test card", "state": "Done", "created": "2024-01-01", "started": "2024-01-03", "completed": "2024-01-07"}]
          EOF
          CONTAINER_ID=$(docker run -d -p 9100:9100 -v "$CARDS_FILE":/cards.json sprint-metrics-smoke --scrape --port 9100 /cards.json)
          echo "Container started: $CONTAINER_ID"
          DEADLINE=$((SECONDS + 30))
          response=""
          while [ $SECONDS -lt $DEADLINE ]; do
            if response=$(curl -sf http://localhost:9100/metrics) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: /metrics endpoint did not become reachable within 30 seconds"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            rm -f "$CARDS_FILE"
            exit 1
          fi
          echo "Scrape endpoint is up"
          echo "$response" | grep -q '^sprint_cycle_time_days'
          echo "OK: response contains sprint_cycle_time_days"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          rm -f "$CARDS_FILE"
          if docker ps -q --filter "publish=9100" | grep -q .; then
            echo "ERROR: A container is still publishing port 9100"
            exit 1
          fi
          echo "OK: container stopped and removed, port 9100 free"
