name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sprint-metrics-smoke .
      - name: Run sprint-metrics --help
        run: |
          set -euo pipefail
          output=$(docker run --rm sprint-metrics-smoke --help)
          echo "$output"
          echo "$output" | grep -q "usage:"
      - name: Verify non-root UID
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint sh sprint-metrics-smoke -c 'id -u')
          echo "Container UID: $uid"
          if [ "$uid" -eq 0 ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
