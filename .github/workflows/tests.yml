name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprint_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRINT_METRICS_DB: postgresql://postgres:postgres@host.docker.internal:5432/sprint_metrics
    steps:
      - uses: actions/checkout@v4
      - name: Verify FROM line is pinned by digest
        run: |
          set -euo pipefail
          grep '^FROM ' Dockerfile | grep -q '@sha256:' || {
            echo "ERROR: Dockerfile FROM line is not pinned by a @sha256: digest"
            exit 1
          }
      - name: Build image
        run: docker build -t sprint-metrics-smoke .
      - name: Run sprint-metrics --help
        run: |
          set -euo pipefail
          output=$(docker run --rm sprint-metrics-smoke --help)
          echo "$output"
          echo "$output" | grep -q "usage:"
      - name: Verify repeating program name fails
        run: |
          set -euo pipefail
          if docker run --rm sprint-metrics-smoke sprint-metrics --help; then
            echo "ERROR: Repeating the program name as an argument should fail"
            exit 1
          fi
          echo "OK: repeating program name correctly fails"
      - name: Verify non-root UID
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint sh sprint-metrics-smoke -c 'id -u')
          echo "Container UID: $uid"
          if [ "$uid" -eq 0 ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
      - name: Verify scrape service is reachable
        run: |
          set -euo pipefail
          CARDS_FILE=$(mktemp /tmp/cards_XXXXXX.json)
          cat > "$CARDS_FILE" << 'EOF'
          [{"title": "test card", "state": "Done", "created": "2024-01-01", "started": "2024-01-03", "completed": "2024-01-07"}]
          EOF
          chmod 644 "$CARDS_FILE"
          CONTAINER_ID=$(docker run -d -p 9100:9100 -v "$CARDS_FILE":/cards.json sprint-metrics-smoke --scrape --port 9100 /cards.json)
          echo "Container started: $CONTAINER_ID"
          DEADLINE=$((SECONDS + 30))
          response=""
          while [ $SECONDS -lt $DEADLINE ]; do
            if response=$(curl -sf http://localhost:9100/metrics) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: /metrics endpoint did not become reachable within 30 seconds"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            rm -f "$CARDS_FILE"
            exit 1
          fi
          echo "Scrape endpoint is up"
          echo "$response" | grep -q '^sprint_cycle_time_days'
          echo "OK: response contains sprint_cycle_time_days"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          rm -f "$CARDS_FILE"
          if docker ps -q --filter "publish=9100" | grep -q .; then
            echo "ERROR: A container is still publishing port 9100"
            exit 1
          fi
          echo "OK: container stopped and removed, port 9100 free"
      - name: Verify service mode
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker run -d -p 8080:8080 --add-host=host.docker.internal:host-gateway -e SPRINT_METRICS_DB="$SPRINT_METRICS_DB" sprint-metrics-smoke --service)
          echo "Service container started: $CONTAINER_ID"
          DEADLINE=$((SECONDS + 30))
          while [ $SECONDS -lt $DEADLINE ]; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: /health did not become reachable within 30 seconds"
            echo "Container logs:"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "Service is healthy"
          POST_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/events \
            -H 'Content-Type: application/json' \
            -d '{"api_version":"1","card_id":"c1","type":"started","timestamp":"2024-01-03T10:00:00Z","sprint":"2024-01","card":{"created":"2024-01-01"}}')
          if [ "$POST_STATUS" != "200" ]; then
            echo "ERROR: POST /events returned $POST_STATUS, expected 200"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: POST /events returned 200"
          SPRINT_BODY=$(curl -sf http://localhost:8080/sprint?label=2024-01)
          echo "$SPRINT_BODY"
          echo "$SPRINT_BODY" | grep -q '"api_version"'
          echo "OK: response contains api_version"
          echo "$SPRINT_BODY" | grep -q '"throughput"'
          echo "OK: response contains throughput"
          echo "Verifying service without SPRINT_METRICS_DB exits non-zero"
          START=$SECONDS
          set +e
          NO_DB_OUTPUT=$(docker run --rm sprint-metrics-smoke --service 2>&1)
          NO_DB_EXIT=$?
          set -e
          ELAPSED=$((SECONDS - START))
          echo "$NO_DB_OUTPUT"
          if [ "$NO_DB_EXIT" -eq 0 ]; then
            echo "ERROR: service without SPRINT_METRICS_DB exited 0, expected non-zero"
            exit 1
          fi
          if [ "$ELAPSED" -gt 15 ]; then
            echo "ERROR: service without SPRINT_METRICS_DB took ${ELAPSED}s, expected <15s"
            exit 1
          fi
          echo "OK: service without SPRINT_METRICS_DB exited with code $NO_DB_EXIT in ${ELAPSED}s"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          if docker ps -q --filter "publish=8080" | grep -q .; then
            echo "ERROR: A container is still publishing port 8080"
            exit 1
          fi
          echo "OK: service container stopped and removed, port 8080 free"
      - name: Verify database recovery
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16")
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "ERROR: Postgres service container not found"
            exit 1
          fi
          CONTAINER_ID=$(docker run -d -p 8080:8080 --add-host=host.docker.internal:host-gateway -e SPRINT_METRICS_DB="$SPRINT_METRICS_DB" sprint-metrics-smoke --service)
          echo "Recovery check service started: $CONTAINER_ID"
          DEADLINE=$((SECONDS + 30))
          while [ $SECONDS -lt $DEADLINE ]; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: /health did not become reachable within 30 seconds"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "Service is healthy"
          # Stop Postgres and verify /health returns 503
          docker stop "$POSTGRES_CONTAINER"
          echo "Postgres stopped"
          sleep 2
          STOPPED_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
          if [ "$STOPPED_STATUS" != "503" ]; then
            echo "ERROR: GET /health while Postgres stopped returned $STOPPED_STATUS, expected 503"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: GET /health returned 503 while Postgres was stopped"
          # Restart Postgres and wait for connections
          docker start "$POSTGRES_CONTAINER"
          echo "Postgres restarted"
          PG_DEADLINE=$((SECONDS + 30))
          while [ $SECONDS -lt $PG_DEADLINE ]; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $PG_DEADLINE ]; then
            echo "ERROR: Postgres did not accept connections within 30 seconds"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "Postgres is accepting connections"
          # Verify /health returns 200 after recovery
          HEALTH_DEADLINE=$((SECONDS + 15))
          RECOVERED=false
          while [ $SECONDS -lt $HEALTH_DEADLINE ]; do
            HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
            if [ "$HEALTH_STATUS" = "200" ]; then
              RECOVERED=true
              break
            fi
            sleep 1
          done
          if [ "$RECOVERED" = "false" ]; then
            echo "ERROR: GET /health did not return 200 after Postgres restart"
            echo "Last status: $HEALTH_STATUS"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: GET /health returned 200 after Postgres restart"
          # Verify POST /events returns 200 after recovery
          POST_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/events \
            -H 'Content-Type: application/json' \
            -d '{"api_version":"1","card_id":"c1","type":"started","timestamp":"2024-01-03T10:00:00Z","sprint":"2024-01","card":{"created":"2024-01-01"}}')
          if [ "$POST_STATUS" != "200" ]; then
            echo "ERROR: POST /events returned $POST_STATUS, expected 200"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: POST /events returned 200 after recovery"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          if docker ps -q --filter "publish=8080" | grep -q .; then
            echo "ERROR: A container is still publishing port 8080"
            exit 1
          fi
          echo "OK: recovery check container stopped and removed, port 8080 free"
