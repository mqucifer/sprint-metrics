name: tests

on:
  pull_request:
  # The merge queue tests each pull request on top of those ahead of it, and
  # waits for this check on that combination before merging (crew#302).
  merge_group:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # The same postgres service as the workspace's compose file
    # (.devcontainer/compose.yaml), image by the same digest, so the DB-backed
    # tests (tests/test_store.py, @requires_db in tests/test_service.py) run
    # here instead of skipping, as they run in the workspace.
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: sprint_metrics
          POSTGRES_PASSWORD: sprint_metrics
          POSTGRES_DB: sprint_metrics
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --tmpfs /var/run/postgresql
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRINT_METRICS_DB: postgresql://sprint_metrics:sprint_metrics@localhost:5432/sprint_metrics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprint_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRINT_METRICS_DB: postgresql://postgres:postgres@host.docker.internal:5432/sprint_metrics
    steps:
      - uses: actions/checkout@v4
      - name: Verify FROM line is pinned by digest
        run: |
          set -euo pipefail
          grep '^FROM ' Dockerfile | grep -q '@sha256:' || {
            echo "ERROR: Dockerfile FROM line is not pinned by a @sha256: digest"
            exit 1
          }
      - name: Build image
        run: docker build -t sprint-metrics-smoke .
      - name: Run sprint-metrics --help
        run: |
          set -euo pipefail
          output=$(docker run --rm sprint-metrics-smoke --help)
          echo "$output"
          echo "$output" | head -1 | grep -q "^usage: sprint-metrics"
          echo "$output" | grep -q "SPRINT_METRICS_DB"
          for flag in --json --markdown --prometheus --scrape --service --sprint-range --prior-sprint --prior --thresholds --metrics --wip-limits --escalations --sprint-date --port --schema cards; do
            if echo "$output" | grep -q -- "$flag"; then
              echo "ERROR: --help names the retired report option $flag"
              exit 1
            fi
          done
          echo "OK: --help describes the service only"
      - name: Verify report arguments are refused
        run: |
          set -euo pipefail
          CARDS_FILE=$(mktemp /tmp/cards_XXXXXX.json)
          echo '[{"created": "2024-01-01", "started": "2024-01-03", "completed": "2024-01-07"}]' > "$CARDS_FILE"
          chmod 644 "$CARDS_FILE"
          check() {
            set +e
            stderr=$(docker run --rm -v "$CARDS_FILE":/cards.json sprint-metrics-smoke "$@" 2>&1 >/dev/null)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "ERROR: sprint-metrics $* exited 0, expected non-zero"
              exit 1
            fi
            if ! echo "$stderr" | grep -q "command-line report tool has been retired"; then
              echo "ERROR: sprint-metrics $* did not name the retired report tool: $stderr"
              exit 1
            fi
            echo "OK: sprint-metrics $* refused with exit $code"
          }
          check /cards.json
          for flag in --scrape --service --json --markdown --prometheus --prior-sprint --prior --thresholds --metrics --wip-limits --escalations --sprint-date --port --schema; do
            check "$flag"
          done
          check --sprint-range 2024-01..2024-02
          rm -f "$CARDS_FILE"
      - name: Verify repeating program name fails
        run: |
          set -euo pipefail
          if docker run --rm sprint-metrics-smoke sprint-metrics --help; then
            echo "ERROR: Repeating the program name as an argument should fail"
            exit 1
          fi
          echo "OK: repeating program name correctly fails"
      - name: Verify non-root UID
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint sh sprint-metrics-smoke -c 'id -u')
          echo "Container UID: $uid"
          if [ "$uid" -eq 0 ]; then
            echo "ERROR: Container is running as root (UID 0)"
            exit 1
          fi
      - name: Build the image before this change
        run: |
          set -euo pipefail
          # The checked-out commit's first parent is the code before this change:
          # the base branch for a pull request's merge commit, the previous main
          # for a push. GET /range is compared against that image, not the last
          # tag, because main can carry unreleased /range changes of its own.
          git fetch --quiet --depth=2 origin "$GITHUB_SHA"
          echo "Comparing against $(git rev-parse HEAD^1)"
          git worktree add --detach /tmp/previous HEAD^1
          docker build -t sprint-metrics-previous /tmp/previous
      - name: Verify the crew's tick against the argument-free image
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="${{ job.services.postgres.id }}"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -c 'CREATE DATABASE previous_tag'
          PREVIOUS_DB="${SPRINT_METRICS_DB%/*}/previous_tag"
          CONTAINER_ID=$(docker run -d -p 8080:8080 --add-host=host.docker.internal:host-gateway -e SPRINT_METRICS_DB="$SPRINT_METRICS_DB" sprint-metrics-smoke)
          # Start the earlier image's service directly: before #771 its entry point was the report tool.
          PREVIOUS_ID=$(docker run -d -p 8081:8080 --add-host=host.docker.internal:host-gateway -e SPRINT_METRICS_DB="$PREVIOUS_DB" --entrypoint python sprint-metrics-previous -c 'import sys; from sprint_metrics.service import run; sys.exit(run())')
          cleanup() {
            docker stop "$CONTAINER_ID" "$PREVIOUS_ID" >/dev/null 2>&1 || true
            docker rm "$CONTAINER_ID" "$PREVIOUS_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for port in 8080 8081; do
            DEADLINE=$((SECONDS + 30))
            until curl -sf "http://localhost:$port/health" > /dev/null 2>&1; do
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "ERROR: /health on port $port did not become reachable within 30 seconds"
                docker logs "$CONTAINER_ID" 2>&1 || true
                docker logs "$PREVIOUS_ID" 2>&1 || true
                exit 1
              fi
              sleep 1
            done
          done
          echo "Both services are healthy"
          tick() {
            port=$1
            post() {
              status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:$port$1" \
                -H 'Content-Type: application/json' -d "$2")
              if [ "$status" != "200" ]; then
                echo "ERROR: POST $1 on port $port returned $status, expected 200" >&2
                exit 1
              fi
            }
            post /sprints '{"name":"2024-01","start_date":"2024-01-01","end_date":"2024-01-31","timezone":"UTC"}'
            post /events '{"api_version":"1","card_id":"c1","type":"started","timestamp":"2024-01-03T10:00:00Z","sprint":"2024-01","card":{"created":"2024-01-01"}}'
            post /events '{"api_version":"1","card_id":"c1","type":"finished","timestamp":"2024-01-07T10:00:00Z","sprint":"2024-01","card":{"created":"2024-01-01"}}'
            curl -sf "http://localhost:$port/range?start=2024-01&end=2024-01"
          }
          RANGE_BODY=$(tick 8080)
          PREVIOUS_BODY=$(tick 8081)
          echo "$RANGE_BODY"
          echo "OK: POST /sprints and POST /events returned 200, GET /range returned 200"
          echo "$RANGE_BODY" | jq -e '.api_version == "4"' > /dev/null
          echo "OK: api_version is 4"
          # api_version is pinned above; every other field must match the earlier image,
          # except the escalation measures this release removes (#774, #775).
          RANGE_FILTER='del(.api_version)
            | del(.sprints[] | .escalation_rate_percent, .escalation_count, .flags.escalation_rate_percent)
            | del(.sprints[] | (.prior, .delta) | objects | .escalation_rate_percent, .escalation_count)'
          if echo "$RANGE_BODY" | grep -q escalation; then
            echo "ERROR: GET /range still carries an escalation measure"
            exit 1
          fi
          if ! diff <(echo "$PREVIOUS_BODY" | jq -S "$RANGE_FILTER") <(echo "$RANGE_BODY" | jq -S "$RANGE_FILTER"); then
            echo "ERROR: GET /range differs from the image before this change"
            exit 1
          fi
          echo "OK: GET /range matches the image before this change field for field"
          SPRINT_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/sprint?label=2024-01")
          if [ "$SPRINT_STATUS" != "410" ]; then
            echo "ERROR: GET /sprint returned $SPRINT_STATUS, expected 410"
            exit 1
          fi
          echo "OK: GET /sprint returned 410 (endpoint removed)"
          METRICS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/metrics")
          if [ "$METRICS_STATUS" != "410" ]; then
            echo "ERROR: GET /metrics returned $METRICS_STATUS, expected 410"
            exit 1
          fi
          echo "OK: GET /metrics returned 410 (endpoint removed)"
          echo "Verifying service without SPRINT_METRICS_DB exits non-zero"
          START=$SECONDS
          set +e
          NO_DB_OUTPUT=$(docker run --rm sprint-metrics-smoke 2>&1)
          NO_DB_EXIT=$?
          set -e
          ELAPSED=$((SECONDS - START))
          echo "$NO_DB_OUTPUT"
          if [ "$NO_DB_EXIT" -eq 0 ]; then
            echo "ERROR: service without SPRINT_METRICS_DB exited 0, expected non-zero"
            exit 1
          fi
          if [ "$ELAPSED" -gt 15 ]; then
            echo "ERROR: service without SPRINT_METRICS_DB took ${ELAPSED}s, expected <15s"
            exit 1
          fi
          echo "$NO_DB_OUTPUT" | grep -q "SPRINT_METRICS_DB"
          echo "OK: service without SPRINT_METRICS_DB exited with code $NO_DB_EXIT in ${ELAPSED}s, naming the database"
          cleanup
          trap - EXIT
          if docker ps -q --filter "publish=8080" | grep -q .; then
            echo "ERROR: A container is still publishing port 8080"
            exit 1
          fi
          echo "OK: service containers stopped and removed, port 8080 free"
      - name: Verify database recovery
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="${{ job.services.postgres.id }}"
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "ERROR: Postgres service container not found"
            exit 1
          fi
          CONTAINER_ID=$(docker run -d -p 8080:8080 --add-host=host.docker.internal:host-gateway -e SPRINT_METRICS_DB="$SPRINT_METRICS_DB" sprint-metrics-smoke)
          echo "Recovery check service started: $CONTAINER_ID"
          DEADLINE=$((SECONDS + 30))
          while [ $SECONDS -lt $DEADLINE ]; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "ERROR: /health did not become reachable within 30 seconds"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "Service is healthy"
          # Stop Postgres and verify /health returns 503
          docker stop "$POSTGRES_CONTAINER"
          echo "Postgres stopped"
          sleep 2
          STOPPED_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
          if [ "$STOPPED_STATUS" != "503" ]; then
            echo "ERROR: GET /health while Postgres stopped returned $STOPPED_STATUS, expected 503"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: GET /health returned 503 while Postgres was stopped"
          # Restart Postgres and wait for connections
          docker start "$POSTGRES_CONTAINER"
          echo "Postgres restarted"
          PG_DEADLINE=$((SECONDS + 30))
          while [ $SECONDS -lt $PG_DEADLINE ]; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ $SECONDS -ge $PG_DEADLINE ]; then
            echo "ERROR: Postgres did not accept connections within 30 seconds"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "Postgres is accepting connections"
          # Verify /health returns 200 after recovery
          HEALTH_DEADLINE=$((SECONDS + 15))
          RECOVERED=false
          while [ $SECONDS -lt $HEALTH_DEADLINE ]; do
            HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
            if [ "$HEALTH_STATUS" = "200" ]; then
              RECOVERED=true
              break
            fi
            sleep 1
          done
          if [ "$RECOVERED" = "false" ]; then
            echo "ERROR: GET /health did not return 200 after Postgres restart"
            echo "Last status: $HEALTH_STATUS"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: GET /health returned 200 after Postgres restart"
          # Verify POST /events returns 200 after recovery
          POST_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/events \
            -H 'Content-Type: application/json' \
            -d '{"api_version":"1","card_id":"c1","type":"started","timestamp":"2024-01-03T10:00:00Z","sprint":"2024-01","card":{"created":"2024-01-01"}}')
          if [ "$POST_STATUS" != "200" ]; then
            echo "ERROR: POST /events returned $POST_STATUS, expected 200"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: POST /events returned 200 after recovery"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          if docker ps -q --filter "publish=8080" | grep -q .; then
            echo "ERROR: A container is still publishing port 8080"
            exit 1
          fi
          echo "OK: recovery check container stopped and removed, port 8080 free"
