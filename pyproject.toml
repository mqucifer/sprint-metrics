[project]
name = "sprint-metrics"
version = "0.0.0"
description = "Delivery metrics for the crew's own board."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
sprint-metrics = "sprint_metrics.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_metrics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly. Left unset, the effective rule set is whatever this
# version of ruff happens to default to — which changed under us: 0.16
# enables flake8-datetimez, so `date.today()` began failing lint and two
# stories were blocked by a rule nobody had chosen.
#
# E501 is deliberately absent: `line-length` above still applies, but it is
# the formatter's to enforce. `ruff format` wraps everything it can, so a
# surviving E501 is by definition something it could not split — a long
# string literal or a URL. That is not a finding anyone can act on, and the
# Developer agent has no technique for it: one card spent half its repair
# attempts failing to shorten a single markdown table row.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
